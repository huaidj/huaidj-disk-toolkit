name: Offline tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: windows-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install pinned JavaScript dependencies
        run: npm ci --ignore-scripts
      - name: Prepare neutral runner configuration
        shell: pwsh
        run: Copy-Item -LiteralPath config.example.json -Destination config.json
      - name: Run offline unit tests
        run: npm test
      - name: Run offline release-contract tests
        run: python -m unittest discover -s tests -p test_release_builder.py

  # No real-disk, firmware, UAC or operating-system install operations run here.
